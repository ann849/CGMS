# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=cgms-backend

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/career_guidance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
