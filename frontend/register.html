<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Career Guidance Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="hero-auth-bg d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="glass-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px; font-size: 1.5rem;">
                            <i class="bi bi-person-plus"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Create Student Account</h3>
                        <p class="text-muted small">Join CGMS to unlock personalized career paths</p>
                    </div>

                    <!-- Alert message container -->
                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="registerForm">
                        
                        <input type="hidden" id="role" value="STUDENT">

                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control form-control-custom" id="fullName" placeholder="Jane Doe" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control form-control-custom" id="email" placeholder="jane@example.com" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-custom" id="password" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="text" class="form-control form-control-custom" id="phone" placeholder="+1234567890">
                            </div>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-md-6">
                                <label for="educationLevel" class="form-label fw-semibold">Education Level</label>
                                <select class="form-select form-select-custom" id="educationLevel">
                                    <option value="High School">High School</option>
                                    <option value="Undergraduate" selected>Undergraduate</option>
                                    <option value="Postgraduate">Postgraduate</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="preferredField" class="form-label fw-semibold">Preferred Field</label>
                                <input type="text" class="form-control form-control-custom" id="preferredField" placeholder="e.g. Computer Science">
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary-gradient w-100 py-3 fs-6 mb-3">
                            Create Account <i class="bi bi-person-check ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="small text-muted mb-0">Already registered? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in here</a></p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;
            const educationLevel = document.getElementById('educationLevel').value;
            const preferredField = document.getElementById('preferredField').value.trim();

            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName,
                        email,
                        password,
                        phone,
                        role,
                        educationLevel,
                        preferredField
                    })
                });

                const result = await response.json();

                if (response.ok && result.data && result.data.accessToken) {
                    const authData = result.data;

                    localStorage.setItem('cgms_jwt_token', authData.accessToken);
                    localStorage.setItem('cgms_user_info', JSON.stringify({
                        id: authData.id,
                        email: authData.email,
                        fullName: authData.fullName,
                        role: authData.role
                    }));

                    alertBox.className = 'alert alert-success mt-2';
                    alertBox.textContent = 'Account created successfully! Redirecting to student dashboard...';
                    alertBox.classList.remove('d-none');

                    setTimeout(() => {
                        window.location.href = 'student/dashboard.html';
                    }, 1000);
                } else {
                    alertBox.className = 'alert alert-danger mt-2';
                    alertBox.textContent = result.message || 'Registration failed. Please try again.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger mt-2';
                alertBox.textContent = 'Cannot connect to backend server. Make sure Spring Boot is running on port 8080.';
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create Account <i class="bi bi-person-check ms-1"></i>';
            }
        });
    </script>
</body>
</html>
