<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Export - CGMS Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">System Reports & Export 📊</h4>
                <button class="btn btn-success font-weight-bold" id="exportBtn">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export Appointments CSV
                </button>
            </header>

            <main class="p-4">
                
                <!-- Alert Box -->
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <!-- Summary Metrics Grid -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card border-start border-primary border-4 text-center">
                            <div class="text-muted small fw-bold text-uppercase">Total Students</div>
                            <div class="fs-2 fw-bold mt-1 text-dark" id="repStudents">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card border-start border-warning border-4 text-center">
                            <div class="text-muted small fw-bold text-uppercase">Total Counsellors</div>
                            <div class="fs-2 fw-bold mt-1 text-dark" id="repCounsellors">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card border-start border-info border-4 text-center">
                            <div class="text-muted small fw-bold text-uppercase">Total Appointments</div>
                            <div class="fs-2 fw-bold mt-1 text-dark" id="repAppointments">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card border-start border-success border-4 text-center">
                            <div class="text-muted small fw-bold text-uppercase">Total Revenue</div>
                            <div class="fs-2 fw-bold mt-1 text-success" id="repRevenue">$0.00</div>
                        </div>
                    </div>
                </div>

                <!-- Appointments Status Breakdown Card -->
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-list-stars text-primary me-2"></i> Appointments Status Breakdown</h5>
                    
                    <div class="row g-3" id="statusBreakdownContainer">
                        <div class="col-12 text-center py-4 text-muted">
                            <div class="spinner-border text-primary me-2"></div> Loading summary data...
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const alertBox = document.getElementById('alertBox');
            const breakdownContainer = document.getElementById('statusBreakdownContainer');

            try {
                const res = await apiCall('/admin/reports/summary');

                if (res.success && res.data) {
                    const d = res.data;
                    document.getElementById('repStudents').textContent = d.totalStudents || 0;
                    document.getElementById('repCounsellors').textContent = d.totalCounsellors || 0;
                    document.getElementById('repAppointments').textContent = d.totalAppointments || 0;
                    document.getElementById('repRevenue').textContent = `$${parseFloat(d.totalRevenue || 0).toFixed(2)}`;

                    const statusMap = d.appointmentsByStatus || {};
                    breakdownContainer.innerHTML = Object.keys(statusMap).map(st => `
                        <div class="col-md-3">
                            <div class="p-3 bg-light rounded-3 border">
                                <div class="small text-muted fw-bold text-uppercase">${st}</div>
                                <div class="fs-3 fw-bold mt-1">${statusMap[st]}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to load report metrics: ' + err.message;
                alertBox.classList.remove('d-none');
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const token = Auth.getToken();
            const exportBtn = document.getElementById('exportBtn');
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Exporting...';

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/admin/reports/export`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Export failed');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'cgms_appointments_report.csv';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Export error: ' + err.message);
            } finally {
                exportBtn.disabled = false;
                exportBtn.innerHTML = '<i class="bi bi-file-earmark-spreadsheet me-1"></i> Export Appointments CSV';
            }
        });
    </script>
</body>
</html>
