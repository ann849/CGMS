<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Admin Control Center (<span id="headerAdminName">Admin</span>) 🛡️</h4>
                <span class="badge bg-danger-subtle text-danger-emphasis px-3 py-2 rounded-pill fw-semibold">Role: ADMIN</span>
            </header>

            <main class="p-4">
                
                <!-- Stat Cards Row -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card border-start border-primary border-4">
                            <div class="text-muted small fw-bold text-uppercase">Total Students</div>
                            <div class="fs-2 fw-bold mt-1 text-dark" id="statStudents">0</div>
                            <a href="manage-students.html" class="small text-primary text-decoration-none">Manage Students <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="stat-card border-start border-warning border-4">
                            <div class="text-muted small fw-bold text-uppercase">Total Counsellors</div>
                            <div class="fs-2 fw-bold mt-1 text-dark" id="statCounsellors">0</div>
                            <a href="manage-counsellors.html" class="small text-warning-emphasis text-decoration-none">Manage Counsellors <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="stat-card border-start border-info border-4">
                            <div class="text-muted small fw-bold text-uppercase">Total Appointments</div>
                            <div class="fs-2 fw-bold mt-1 text-dark" id="statAppointments">0</div>
                            <a href="reports.html" class="small text-info text-decoration-none">View Reports <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="stat-card border-start border-success border-4">
                            <div class="text-muted small fw-bold text-uppercase">Total Revenue</div>
                            <div class="fs-2 fw-bold mt-1 text-success" id="statRevenue">$0.00</div>
                            <a href="payments.html" class="small text-success text-decoration-none">Audit Payments <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="row g-4 mb-4">
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-pie-chart-fill text-primary me-2"></i> Appointments by Status</h5>
                            <div class="chart-container style-chart" style="position: relative; height:300px;">
                                <canvas id="statusPieChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-bar-chart-fill text-success me-2"></i> System Metrics Overview</h5>
                            <div class="chart-container style-chart" style="position: relative; height:300px;">
                                <canvas id="metricsBarChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        let pieChart, barChart;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await apiCall('/admin/reports/summary');
                if (res.success && res.data) {
                    const data = res.data;
                    document.getElementById('statStudents').textContent = data.totalStudents || 0;
                    document.getElementById('statCounsellors').textContent = data.totalCounsellors || 0;
                    document.getElementById('statAppointments').textContent = data.totalAppointments || 0;
                    document.getElementById('statRevenue').textContent = `$${parseFloat(data.totalRevenue || 0).toFixed(2)}`;

                    renderCharts(data);
                }
            } catch (err) {
                console.error('Error fetching admin summary stats:', err);
            }
        });

        function renderCharts(data) {
            const statusMap = data.appointmentsByStatus || {};
            const statusLabels = Object.keys(statusMap);
            const statusValues = Object.values(statusMap);

            // 1. Pie Chart
            const ctxPie = document.getElementById('statusPieChart').getContext('2d');
            pieChart = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: statusLabels.length ? statusLabels : ['PENDING', 'CONFIRMED', 'COMPLETED', 'CANCELLED'],
                    datasets: [{
                        data: statusValues.length ? statusValues : [0, 0, 0, 0],
                        backgroundColor: ['#f59e0b', '#10b981', '#4f46e5', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // 2. Bar Chart
            const ctxBar = document.getElementById('metricsBarChart').getContext('2d');
            barChart = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Students', 'Counsellors', 'Appointments'],
                    datasets: [{
                        label: 'Total Count',
                        data: [data.totalStudents || 0, data.totalCounsellors || 0, data.totalAppointments || 0],
                        backgroundColor: ['#3b82f6', '#f59e0b', '#8b5cf6']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
    </script>
</body>
</html>
