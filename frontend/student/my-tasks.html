<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Assigned Career Tasks 📝</h4>
                <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-semibold">Role: STUDENT</span>
            </header>

            <main class="p-4">
                
                <!-- Alert Box -->
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-card-checklist text-primary me-2"></i> Active Assignments & Homework</h5>
                    
                    <div id="tasksContainer">
                        <div class="text-center py-4 text-muted">
                            <div class="spinner-border text-primary me-2" role="status"></div>
                            <span>Loading assigned tasks...</span>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Submit Task Modal -->
    <div class="modal fade" id="submitTaskModal" tabindex="-1" aria-labelledby="submitTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="submitTaskModalLabel">Submit Task Assignment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="submissionForm">
                        <input type="hidden" id="modalTaskId">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Task Title</label>
                            <input type="text" class="form-control" id="modalTaskTitle" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="submissionText" class="form-label fw-semibold">Your Solution / Text Answer</label>
                            <textarea class="form-control form-control-custom" id="submissionText" rows="4" placeholder="Write your task response or answer notes here..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="submissionFile" class="form-label fw-semibold">File URL / Attachment Link (Optional)</label>
                            <input type="text" class="form-control form-control-custom" id="submissionFile" placeholder="e.g. https://drive.google.com/your-file-link">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" id="modalSubmitBtn" class="btn btn-primary-gradient">Submit Homework</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        let submitModalInstance;

        document.addEventListener('DOMContentLoaded', async () => {
            submitModalInstance = new bootstrap.Modal(document.getElementById('submitTaskModal'));
            loadTasks();
        });

        async function loadTasks() {
            const container = document.getElementById('tasksContainer');
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await apiCall('/student/tasks');

                if (res.success && res.data && res.data.length > 0) {
                    container.innerHTML = `
                        <div class="row g-3">
                            ${res.data.map(t => `
                                <div class="col-md-6">
                                    <div class="card h-100 border border-light-subtle rounded-4 p-4 shadow-sm">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h6 class="fw-bold text-dark mb-0">${t.title}</h6>
                                            ${getTaskStatusBadge(t.status)}
                                        </div>
                                        <p class="small text-muted mb-3">${t.description || 'No additional instructions provided.'}</p>
                                        <div class="small text-muted mb-2"><i class="bi bi-person me-1"></i> Assigned by: <strong>${t.counsellorName}</strong></div>
                                        <div class="small text-muted mb-3"><i class="bi bi-calendar-event me-1"></i> Due Date: <strong>${t.dueDate || 'Flexible'}</strong></div>
                                        
                                        <div class="mt-auto pt-2 border-top">
                                            ${t.status === 'ASSIGNED' ? `
                                                <button class="btn btn-sm btn-primary-gradient w-100" onclick="openSubmitModal(${t.id}, '${escapeQuotes(t.title)}')">
                                                    <i class="bi bi-upload me-1"></i> Submit Solution
                                                </button>
                                            ` : `
                                                <button class="btn btn-sm btn-outline-secondary w-100" onclick="openSubmitModal(${t.id}, '${escapeQuotes(t.title)}')">
                                                    <i class="bi bi-pencil me-1"></i> Update Submission
                                                </button>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5 text-muted">
                            <i class="bi bi-card-checklist fs-1 d-block mb-2 text-muted"></i>
                            No tasks currently assigned to you.
                        </div>
                    `;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to load tasks: ' + err.message;
                alertBox.classList.remove('d-none');
                container.innerHTML = '';
            }
        }

        function openSubmitModal(id, title) {
            document.getElementById('modalTaskId').value = id;
            document.getElementById('modalTaskTitle').value = title;
            document.getElementById('submissionText').value = '';
            document.getElementById('submissionFile').value = '';
            submitModalInstance.show();
        }

        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const taskId = document.getElementById('modalTaskId').value;
            const submissionText = document.getElementById('submissionText').value.trim();
            const submissionFile = document.getElementById('submissionFile').value.trim();
            const submitBtn = document.getElementById('modalSubmitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

            try {
                const res = await apiCall(`/student/tasks/${taskId}/submit`, 'POST', {
                    submissionText,
                    submissionFile
                });

                if (res.success) {
                    submitModalInstance.hide();
                    const alertBox = document.getElementById('alertBox');
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Task submitted successfully!';
                    alertBox.classList.remove('d-none');
                    loadTasks();
                }
            } catch (err) {
                alert('Submission failed: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Homework';
            }
        });

        function getTaskStatusBadge(status) {
            switch (status) {
                case 'ASSIGNED': return '<span class="badge bg-warning-subtle text-warning-emphasis">ASSIGNED</span>';
                case 'SUBMITTED': return '<span class="badge bg-info-subtle text-info-emphasis">SUBMITTED</span>';
                case 'EVALUATED': return '<span class="badge bg-success-subtle text-success">EVALUATED</span>';
                default: return `<span class="badge bg-secondary-subtle text-secondary">${status}</span>`;
            }
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
