<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Checkout & Payment Gateway 💳</h4>
                <a href="my-appointments.html" class="btn btn-outline-secondary btn-sm">Cancel</a>
            </header>

            <main class="p-4">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        
                        <!-- Alert Box -->
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom">
                                <div>
                                    <span class="text-muted small text-uppercase fw-bold">Consultation Fee</span>
                                    <h3 class="fw-bold text-primary mb-0" id="displayAmount">$50.00</h3>
                                </div>
                                <span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill">Status: Payment Required</span>
                            </div>

                            <form id="paymentForm">
                                <label class="form-label fw-semibold mb-2">Select Payment Method</label>
                                <div class="row g-2 mb-4">
                                    <div class="col-4">
                                        <div class="role-badge-option active text-center p-3" data-method="CREDIT_CARD">
                                            <i class="bi bi-credit-card fs-4 d-block mb-1"></i>
                                            <span class="small fw-semibold">Card</span>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="role-badge-option text-center p-3" data-method="UPI">
                                            <i class="bi bi-qr-code-scan fs-4 d-block mb-1"></i>
                                            <span class="small fw-semibold">UPI</span>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="role-badge-option text-center p-3" data-method="NET_BANKING">
                                            <i class="bi bi-bank fs-4 d-block mb-1"></i>
                                            <span class="small fw-semibold">Net Banking</span>
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" id="paymentMethod" value="CREDIT_CARD">

                                <!-- Credit Card Fields -->
                                <div id="cardFields">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Card Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-credit-card-2-front"></i></span>
                                            <input type="text" class="form-control form-control-custom" placeholder="4532 •••• •••• 8892" value="4532 8912 3456 8892" required>
                                        </div>
                                    </div>
                                    <div class="row g-2 mb-3">
                                        <div class="col-6">
                                            <label class="form-label fw-semibold">Expiry Date</label>
                                            <input type="text" class="form-control form-control-custom" placeholder="MM/YY" value="12/28" required>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label fw-semibold">CVV</label>
                                            <input type="password" class="form-control form-control-custom" placeholder="•••" value="123" required>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" id="payBtn" class="btn btn-primary-gradient w-100 py-3 fs-6 mt-3">
                                    <i class="bi bi-shield-check me-1"></i> Pay Now & Confirm Appointment
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const appointmentId = urlParams.get('appointmentId');
        const amount = urlParams.get('amount') || '500';

        document.getElementById('displayAmount').textContent = `$${amount}.00`;

        // Payment method selection
        let selectedMethod = 'CREDIT_CARD';
        document.querySelectorAll('.role-badge-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.role-badge-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedMethod = opt.getAttribute('data-method');
                document.getElementById('paymentMethod').value = selectedMethod;
            });
        });

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertBox = document.getElementById('alertBox');
            const payBtn = document.getElementById('payBtn');

            if (!appointmentId) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Missing appointment ID.';
                alertBox.classList.remove('d-none');
                return;
            }

            alertBox.classList.add('d-none');
            payBtn.disabled = true;
            payBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing Payment Gateway...';

            try {
                const res = await apiCall('/student/payments', 'POST', {
                    appointmentId: parseInt(appointmentId),
                    amount: parseFloat(amount),
                    paymentMethod: selectedMethod
                });

                if (res.success && res.data) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerHTML = `
                        <strong>Payment Successful!</strong><br>
                        Transaction ID: <code>${res.data.transactionId}</code><br>
                        Your appointment has been <strong>CONFIRMED</strong>. Redirecting...
                    `;
                    alertBox.classList.remove('d-none');

                    setTimeout(() => {
                        window.location.href = 'my-appointments.html';
                    }, 1500);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = res.message || 'Payment failed.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Payment processing error: ' + err.message;
                alertBox.classList.remove('d-none');
            } finally {
                payBtn.disabled = false;
                payBtn.innerHTML = '<i class="bi bi-shield-check me-1"></i> Pay Now & Confirm Appointment';
            }
        });
    </script>
</body>
</html>
