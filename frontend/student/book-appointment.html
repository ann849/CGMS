<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Book Session with <span id="counsellorNameHeading">Counsellor</span> 🗓️</h4>
                <a href="counsellors.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Counsellors</a>
            </header>

            <main class="p-4">
                
                <!-- Alert Box -->
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h5 class="fw-bold mb-1"><i class="bi bi-clock-history text-primary me-2"></i> Available Time Slots</h5>
                    <p class="text-muted small mb-4">Select an open slot below to confirm your guidance appointment.</p>

                    <div id="slotsContainer">
                        <div class="text-center py-4 text-muted">
                            <div class="spinner-border text-primary me-2" role="status"></div>
                            <span>Fetching available time slots...</span>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const counsellorId = urlParams.get('counsellorId');
        const counsellorName = urlParams.get('name') || 'Counsellor';

        document.getElementById('counsellorNameHeading').textContent = counsellorName;

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slotsContainer');
            const alertBox = document.getElementById('alertBox');

            if (!counsellorId) {
                alertBox.className = 'alert alert-warning';
                alertBox.textContent = 'No counsellor selected. Please select a counsellor first.';
                alertBox.classList.remove('d-none');
                container.innerHTML = '';
                return;
            }

            try {
                const res = await apiCall(`/student/counsellors/${counsellorId}/availability`);

                if (res.success && res.data && res.data.length > 0) {
                    container.innerHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>Day</th>
                                        <th>Time Slot</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${res.data.map(slot => `
                                        <tr>
                                            <td class="fw-semibold">${slot.date || 'Flexible Date'}</td>
                                            <td><span class="badge bg-secondary-subtle text-secondary">${slot.dayOfWeek || 'Weekday'}</span></td>
                                            <td class="fw-bold text-primary">${slot.startTime || '09:00'} - ${slot.endTime || '10:00'}</td>
                                            <td><span class="badge bg-success-subtle text-success">Available</span></td>
                                            <td>
                                                <button class="btn btn-sm btn-primary-gradient" onclick="bookSlot(${slot.id})">
                                                    <i class="bi bi-calendar-plus me-1"></i> Book Slot
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-calendar-x fs-1 text-muted d-block mb-3"></i>
                            <h6 class="fw-bold text-muted">No open slots available for this counsellor</h6>
                            <p class="small text-muted mb-3">Please check back later or select another counsellor.</p>
                            <a href="counsellors.html" class="btn btn-outline-primary btn-sm">Browse Other Counsellors</a>
                        </div>
                    `;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Error loading availability: ' + err.message;
                alertBox.classList.remove('d-none');
                container.innerHTML = '';
            }
        });

        async function bookSlot(slotId) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert alert-info';
            alertBox.textContent = 'Processing your appointment booking...';
            alertBox.classList.remove('d-none');

            try {
                const res = await apiCall('/student/appointments', 'POST', {
                    counsellorId: parseInt(counsellorId),
                    availabilitySlotId: slotId
                });

                if (res.success && res.data) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Appointment slot reserved! Redirecting to payment portal...';
                    
                    setTimeout(() => {
                        window.location.href = `payment.html?appointmentId=${res.data.id}&amount=500`;
                    }, 1000);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = res.message || 'Failed to book slot.';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Booking failed: ' + err.message;
            }
        }
    </script>
</body>
</html>
