<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance Management System - Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="hero-auth-bg">

    <div class="container my-auto py-5">
        <div class="row align-items-center justify-content-center g-5">
            <!-- Left Branding Column -->
            <div class="col-lg-6 text-white pe-lg-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                        <i class="bi bi-compass-fill"></i>
                    </div>
                    <span class="fs-2 fw-bold text-white tracking-tight">CGMS Portal</span>
                </div>
                <h1 class="display-4 fw-extrabold mb-3 lh-sm">Shape Your Future with Expert Career Guidance</h1>
                <p class="lead opacity-75 mb-4">
                    Empowering students with personalized career paths, seamless counsellor appointments, and centralized administrative management.
                </p>
                <div class="d-flex gap-4 opacity-90">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-info fs-5"></i>
                        <span>Student Assessments</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-info fs-5"></i>
                        <span>1-on-1 Counselling</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-info fs-5"></i>
                        <span>Admin Oversight</span>
                    </div>
                </div>
            </div>

            <!-- Right Login / Register Auth Card -->
            <div class="col-lg-5">
                <div class="glass-card p-4 p-md-5">
                    
                    <!-- Navigation Tabs -->
                    <ul class="nav nav-pills nav-pills-custom nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Login
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">
                                <i class="bi bi-person-plus me-1"></i> Register
                            </button>
                        </li>
                    </ul>

                    <!-- Alert Box -->
                    <div id="authAlert" class="alert d-none" role="alert"></div>

                    <!-- Tab Content -->
                    <div class="tab-content" id="authTabsContent">
                        
                        <!-- LOGIN PANEL -->
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control form-control-custom border-start-0" id="loginEmail" placeholder="name@example.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label for="loginPassword" class="form-label fw-semibold">Password</label>
                                        <a href="#" class="text-decoration-none small text-primary">Forgot password?</a>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                        <input type="password" class="form-control form-control-custom border-start-0" id="loginPassword" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary-gradient w-100 py-3 fs-6 mt-2">
                                    Sign In <i class="bi bi-arrow-right ms-1"></i>
                                </button>
                            </form>
                        </div>

                        <!-- REGISTER PANEL -->
                        <div class="tab-pane fade" id="register-panel" role="tabpanel">
                            <form id="registerForm">
                                
                                <!-- Role Selector -->
                                <label class="form-label fw-semibold mb-2">Select Your Role</label>
                                <div class="row g-2 mb-3">
                                    <div class="col-4">
                                        <div class="role-badge-option active" data-role="STUDENT">
                                            <i class="bi bi-mortarboard fs-5 d-block mb-1"></i>
                                            <span class="small">Student</span>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="role-badge-option" data-role="COUNSELLOR">
                                            <i class="bi bi-person-badge fs-5 d-block mb-1"></i>
                                            <span class="small">Counsellor</span>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="role-badge-option" data-role="ADMIN">
                                            <i class="bi bi-shield-lock fs-5 d-block mb-1"></i>
                                            <span class="small">Admin</span>
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" id="registerRole" value="STUDENT">

                                <div class="mb-3">
                                    <label for="registerName" class="form-label fw-semibold">Full Name</label>
                                    <input type="text" class="form-control form-control-custom" id="registerName" placeholder="John Doe" required>
                                </div>

                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label fw-semibold">Email Address</label>
                                    <input type="email" class="form-control form-control-custom" id="registerEmail" placeholder="name@example.com" required>
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <label for="registerPassword" class="form-label fw-semibold">Password</label>
                                        <input type="password" class="form-control form-control-custom" id="registerPassword" placeholder="••••••••" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="registerPhone" class="form-label fw-semibold">Phone Number</label>
                                        <input type="text" class="form-control form-control-custom" id="registerPhone" placeholder="+1234567890">
                                    </div>
                                </div>

                                <!-- Dynamic Role Specific Fields -->
                                <div id="studentFields" class="mb-3">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label fw-semibold">Education Level</label>
                                            <select class="form-select form-select-custom" id="registerEducationLevel">
                                                <option value="High School">High School</option>
                                                <option value="Undergraduate" selected>Undergraduate</option>
                                                <option value="Postgraduate">Postgraduate</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label fw-semibold">Preferred Field</label>
                                            <input type="text" class="form-control form-control-custom" id="registerPreferredField" placeholder="e.g. Technology">
                                        </div>
                                    </div>
                                </div>

                                <div id="counsellorFields" class="mb-3 d-none">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label fw-semibold">Qualification</label>
                                            <input type="text" class="form-control form-control-custom" id="registerQualification" placeholder="e.g. M.Sc Psychology">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label fw-semibold">Specialization</label>
                                            <input type="text" class="form-control form-control-custom" id="registerSpecialization" placeholder="e.g. STEM Careers">
                                        </div>
                                    </div>
                                </div>

                                <div id="adminFields" class="mb-3 d-none">
                                    <label class="form-label fw-semibold">Department</label>
                                    <input type="text" class="form-control form-control-custom" id="registerDepartment" placeholder="e.g. Operations">
                                </div>

                                <button type="submit" class="btn btn-primary-gradient w-100 py-3 fs-6 mt-2">
                                    Create Account <i class="bi bi-person-check ms-1"></i>
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
