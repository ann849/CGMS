<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Career Guidance Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="hero-auth-bg d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px; font-size: 1.5rem;">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted small">Sign in to your CGMS account</p>
                    </div>

                    <!-- Alert message container -->
                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control form-control-custom border-start-0" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control form-control-custom border-start-0" id="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary-gradient w-100 py-3 fs-6 mb-3">
                            Sign In <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="small text-muted mb-0">Don't have a student account? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a></p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.data && result.data.accessToken) {
                    const authData = result.data;
                    
                    // Store JWT token and User Info in localStorage
                    localStorage.setItem('cgms_jwt_token', authData.accessToken);
                    localStorage.setItem('cgms_user_info', JSON.stringify({
                        id: authData.id,
                        email: authData.email,
                        fullName: authData.fullName,
                        role: authData.role
                    }));

                    alertBox.className = 'alert alert-success mt-2';
                    alertBox.textContent = 'Login successful! Redirecting to your dashboard...';
                    alertBox.classList.remove('d-none');

                    setTimeout(() => {
                        redirectByRole(authData.role);
                    }, 800);
                } else {
                    alertBox.className = 'alert alert-danger mt-2';
                    alertBox.textContent = result.message || 'Login failed. Please check your credentials.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger mt-2';
                alertBox.textContent = 'Cannot connect to backend server. Make sure Spring Boot is running on port 8080.';
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="bi bi-arrow-right ms-1"></i>';
            }
        });

        function redirectByRole(role) {
            switch (role) {
                case 'STUDENT':
                    window.location.href = 'student/dashboard.html';
                    break;
                case 'COUNSELLOR':
                    window.location.href = 'counsellor/dashboard.html';
                    break;
                case 'ADMIN':
                    window.location.href = 'admin/dashboard.html';
                    break;
                default:
                    window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
