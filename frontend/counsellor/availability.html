<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Availability - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Manage Availability Slots ⏰</h4>
                <span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill fw-semibold">Role: COUNSELLOR</span>
            </header>

            <main class="p-4">
                
                <!-- Alert Box -->
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <div class="row g-4">
                    <!-- Add Slot Form Card -->
                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle-fill text-warning me-2"></i> Add Open Slot</h5>

                            <form id="slotForm">
                                <div class="mb-3">
                                    <label for="date" class="form-label fw-semibold">Date</label>
                                    <input type="date" class="form-control form-control-custom" id="date" required>
                                </div>

                                <div class="mb-3">
                                    <label for="startTime" class="form-label fw-semibold">Start Time</label>
                                    <input type="time" class="form-control form-control-custom" id="startTime" required>
                                </div>

                                <div class="mb-4">
                                    <label for="endTime" class="form-label fw-semibold">End Time</label>
                                    <input type="time" class="form-control form-control-custom" id="endTime" required>
                                </div>

                                <button type="submit" id="addSlotBtn" class="btn btn-warning text-dark fw-bold w-100 py-3 fs-6">
                                    <i class="bi bi-plus-lg me-1"></i> Publish Slot
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Slots Table Card -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-calendar3 text-primary me-2"></i> Your Scheduled Slots</h5>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Date</th>
                                            <th>Day</th>
                                            <th>Time Slot</th>
                                            <th>Booking State</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="slotsTableBody">
                                        <tr>
                                            <td colspan="5" class="text-center py-4 text-muted">
                                                <div class="spinner-border spinner-border-sm me-2"></div> Loading your slots...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Set default date to today
            document.getElementById('date').valueAsDate = new Date();
            loadSlots();
        });

        async function loadSlots() {
            const tableBody = document.getElementById('slotsTableBody');
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await apiCall('/counsellor/availability');

                if (res.success && res.data && res.data.length > 0) {
                    tableBody.innerHTML = res.data.map(slot => `
                        <tr>
                            <td class="fw-semibold">${slot.date || 'Flexible'}</td>
                            <td><span class="badge bg-secondary-subtle text-secondary">${slot.dayOfWeek || 'Day'}</span></td>
                            <td class="fw-bold text-primary">${slot.startTime} - ${slot.endTime}</td>
                            <td>
                                ${slot.isBooked ? `
                                    <span class="badge bg-danger-subtle text-danger"><i class="bi bi-person-check-fill me-1"></i> Booked</span>
                                ` : `
                                    <span class="badge bg-success-subtle text-success"><i class="bi bi-check-circle me-1"></i> Available</span>
                                `}
                            </td>
                            <td>
                                ${!slot.isBooked ? `
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSlot(${slot.id})">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                ` : `
                                    <span class="text-muted small">Locked</span>
                                `}
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-clock-history fs-2 d-block mb-2 text-muted"></i>
                                You have not added any availability slots yet.
                            </td>
                        </tr>
                    `;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to load slots: ' + err.message;
                alertBox.classList.remove('d-none');
                tableBody.innerHTML = '';
            }
        }

        document.getElementById('slotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertBox = document.getElementById('alertBox');
            const addSlotBtn = document.getElementById('addSlotBtn');

            const date = document.getElementById('date').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            alertBox.classList.add('d-none');
            addSlotBtn.disabled = true;

            try {
                const res = await apiCall('/counsellor/availability', 'POST', {
                    date,
                    startTime: startTime.length === 5 ? startTime + ':00' : startTime,
                    endTime: endTime.length === 5 ? endTime + ':00' : endTime
                });

                if (res.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Availability slot added successfully!';
                    alertBox.classList.remove('d-none');
                    loadSlots();
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to add slot: ' + err.message;
                alertBox.classList.remove('d-none');
            } finally {
                addSlotBtn.disabled = false;
            }
        });

        async function deleteSlot(id) {
            if (confirm(`Are you sure you want to remove slot #${id}?`)) {
                try {
                    const res = await apiCall(`/counsellor/availability/${id}`, 'DELETE');
                    if (res.success) {
                        loadSlots();
                    }
                } catch (err) {
                    alert('Cannot delete slot: ' + err.message);
                }
            }
        }
    </script>
</body>
</html>
