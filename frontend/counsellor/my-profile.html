<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Manage Counsellor Profile 👤</h4>
                <span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill fw-semibold">Role: COUNSELLOR</span>
            </header>

            <main class="p-4">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        
                        <!-- Alert Box -->
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-person-lines-fill text-warning me-2"></i> Professional Qualifications & Bio</h5>

                            <form id="profileForm">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="name" class="form-label fw-semibold">Full Name</label>
                                        <input type="text" class="form-control form-control-custom" id="name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label fw-semibold">Email Address (Read-only)</label>
                                        <input type="email" class="form-control form-control-custom bg-light" id="email" readonly>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                        <input type="text" class="form-control form-control-custom" id="phone">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="experience" class="form-label fw-semibold">Years of Experience</label>
                                        <input type="number" class="form-control form-control-custom" id="experience" min="0" placeholder="e.g. 5">
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="qualification" class="form-label fw-semibold">Highest Qualification</label>
                                        <input type="text" class="form-control form-control-custom" id="qualification" placeholder="e.g. M.Sc Career Psychology">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="specialization" class="form-label fw-semibold">Specialization Field</label>
                                        <input type="text" class="form-control form-control-custom" id="specialization" placeholder="e.g. STEM & Engineering">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="profilePhoto" class="form-label fw-semibold">Profile Photo URL</label>
                                    <input type="text" class="form-control form-control-custom" id="profilePhoto" placeholder="https://example.com/photo.jpg">
                                </div>

                                <div class="mb-4">
                                    <label for="bio" class="form-label fw-semibold">Professional Summary / Bio</label>
                                    <textarea class="form-control form-control-custom" id="bio" rows="4" placeholder="Briefly describe your guidance expertise and methodology..."></textarea>
                                </div>

                                <button type="submit" id="saveBtn" class="btn btn-warning text-dark font-weight-bold w-100 py-3 fs-6">
                                    <i class="bi bi-check-circle me-1"></i> Save Profile Updates
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await apiCall('/counsellor/profile');
                if (res.success && res.data) {
                    const p = res.data;
                    document.getElementById('name').value = p.name || '';
                    document.getElementById('email').value = p.email || '';
                    document.getElementById('phone').value = p.phone || '';
                    document.getElementById('experience').value = p.experience || 0;
                    document.getElementById('qualification').value = p.qualification || '';
                    document.getElementById('specialization').value = p.specialization || '';
                    document.getElementById('profilePhoto').value = p.profilePhoto || '';
                    document.getElementById('bio').value = p.bio || '';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Error loading profile: ' + err.message;
                alertBox.classList.remove('d-none');
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertBox = document.getElementById('alertBox');
            const saveBtn = document.getElementById('saveBtn');

            alertBox.classList.add('d-none');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving changes...';

            const payload = {
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                experience: parseInt(document.getElementById('experience').value) || 0,
                qualification: document.getElementById('qualification').value.trim(),
                specialization: document.getElementById('specialization').value.trim(),
                profilePhoto: document.getElementById('profilePhoto').value.trim(),
                bio: document.getElementById('bio').value.trim()
            };

            try {
                const res = await apiCall('/counsellor/profile', 'PUT', payload);

                if (res.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Profile updated successfully!';
                    alertBox.classList.remove('d-none');
                    
                    // Update stored session user name if changed
                    const sessionUser = Auth.getUser();
                    if (sessionUser) {
                        sessionUser.fullName = payload.name;
                        localStorage.setItem(CONFIG.STORAGE_KEY_USER, JSON.stringify(sessionUser));
                        document.getElementById('headerCounsellorName').textContent = payload.name;
                    }
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to update profile: ' + err.message;
                alertBox.classList.remove('d-none');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Save Profile Updates';
            }
        });
    </script>
</body>
</html>
