<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counsellor Appointments - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Student Guidance Appointments 📅</h4>
                <span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill fw-semibold">Role: COUNSELLOR</span>
            </header>

            <main class="p-4">
                
                <!-- Alert Box -->
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-calendar-check text-primary me-2"></i> Booked Sessions List</h5>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Appt #</th>
                                    <th>Student Name</th>
                                    <th>Scheduled Date & Time</th>
                                    <th>Current Status</th>
                                    <th>Update Status</th>
                                </tr>
                            </thead>
                            <tbody id="appointmentsTableBody">
                                <tr>
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm me-2"></div> Loading student appointments...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAppointments);

        async function loadAppointments() {
            const tableBody = document.getElementById('appointmentsTableBody');
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await apiCall('/counsellor/appointments');

                if (res.success && res.data && res.data.length > 0) {
                    tableBody.innerHTML = res.data.map(a => `
                        <tr>
                            <td class="fw-bold">#${a.id}</td>
                            <td class="fw-semibold"><i class="bi bi-person me-1 text-primary"></i> ${a.studentName}</td>
                            <td>${formatDateTime(a.appointmentDate || a.slotDate)}</td>
                            <td>${getStatusBadge(a.status)}</td>
                            <td>
                                <select class="form-select form-select-sm d-inline-block w-auto" onchange="updateStatus(${a.id}, this.value)">
                                    <option value="PENDING" ${a.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                                    <option value="CONFIRMED" ${a.status === 'CONFIRMED' ? 'selected' : ''}>CONFIRMED</option>
                                    <option value="COMPLETED" ${a.status === 'COMPLETED' ? 'selected' : ''}>COMPLETED</option>
                                    <option value="CANCELLED" ${a.status === 'CANCELLED' ? 'selected' : ''}>CANCELLED</option>
                                </select>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-calendar-x fs-2 d-block mb-2 text-muted"></i>
                                No student appointments booked with you yet.
                            </td>
                        </tr>
                    `;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to load appointments: ' + err.message;
                alertBox.classList.remove('d-none');
                tableBody.innerHTML = '';
            }
        }

        async function updateStatus(id, newStatus) {
            const alertBox = document.getElementById('alertBox');
            try {
                const res = await apiCall(`/counsellor/appointments/${id}/status`, 'PUT', { status: newStatus });
                if (res.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = `Appointment #${id} status updated to ${newStatus}`;
                    alertBox.classList.remove('d-none');
                    loadAppointments();
                }
            } catch (err) {
                alert('Status update failed: ' + err.message);
            }
        }

        function getStatusBadge(status) {
            switch (status) {
                case 'CONFIRMED': return '<span class="badge bg-success-subtle text-success">CONFIRMED</span>';
                case 'PENDING': return '<span class="badge bg-warning-subtle text-warning-emphasis">PENDING</span>';
                case 'COMPLETED': return '<span class="badge bg-primary-subtle text-primary">COMPLETED</span>';
                case 'CANCELLED': return '<span class="badge bg-danger-subtle text-danger">CANCELLED</span>';
                default: return `<span class="badge bg-secondary-subtle text-secondary">${status}</span>`;
            }
        }

        function formatDateTime(dtStr) {
            if (!dtStr) return 'TBD';
            const dt = new Date(dtStr);
            return dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
