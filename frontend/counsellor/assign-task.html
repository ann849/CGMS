<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Task - CGMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex" id="app-layout">
        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <header class="dashboard-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Assign Student Homework / Task 📝</h4>
                <span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill fw-semibold">Role: COUNSELLOR</span>
            </header>

            <main class="p-4">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        
                        <!-- Alert Box -->
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-warning me-2"></i> New Career Assignment</h5>

                            <form id="assignTaskForm">
                                <div class="mb-3">
                                    <label for="studentId" class="form-label fw-semibold">Select Student</label>
                                    <select class="form-select form-select-custom" id="studentId" required>
                                        <option value="" disabled selected>Loading student list...</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="title" class="form-label fw-semibold">Task Title</label>
                                    <input type="text" class="form-control form-control-custom" id="title" placeholder="e.g. Stream Exploration & Skill Assessment Notes" required>
                                </div>

                                <div class="mb-3">
                                    <label for="dueDate" class="form-label fw-semibold">Due Date</label>
                                    <input type="date" class="form-control form-control-custom" id="dueDate">
                                </div>

                                <div class="mb-4">
                                    <label for="description" class="form-label fw-semibold">Task Instructions & Description</label>
                                    <textarea class="form-control form-control-custom" id="description" rows="4" placeholder="Detail the instructions or questions student needs to answer..."></textarea>
                                </div>

                                <button type="submit" id="submitBtn" class="btn btn-warning text-dark fw-bold w-100 py-3 fs-6">
                                    <i class="bi bi-send me-1"></i> Assign Task to Student
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const studentSelect = document.getElementById('studentId');
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await apiCall('/counsellor/students');

                if (res.success && res.data && res.data.length > 0) {
                    studentSelect.innerHTML = `
                        <option value="" disabled selected>-- Choose a registered student --</option>
                        ${res.data.map(s => `
                            <option value="${s.id}">${s.name} (${s.email}) ${s.education ? '- ' + s.education : ''}</option>
                        `).join('')}
                    `;
                } else {
                    studentSelect.innerHTML = `<option value="" disabled selected>No students registered in system</option>`;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to load students list: ' + err.message;
                alertBox.classList.remove('d-none');
            }
        });

        document.getElementById('assignTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            const studentId = document.getElementById('studentId').value;
            const title = document.getElementById('title').value.trim();
            const dueDate = document.getElementById('dueDate').value;
            const description = document.getElementById('description').value.trim();

            if (!studentId) {
                alertBox.className = 'alert alert-warning';
                alertBox.textContent = 'Please select a student.';
                alertBox.classList.remove('d-none');
                return;
            }

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;

            try {
                const res = await apiCall('/counsellor/tasks', 'POST', {
                    studentId: parseInt(studentId),
                    title,
                    dueDate: dueDate || null,
                    description
                });

                if (res.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Task assigned successfully!';
                    alertBox.classList.remove('d-none');
                    
                    document.getElementById('title').value = '';
                    document.getElementById('description').value = '';
                    document.getElementById('dueDate').value = '';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Failed to assign task: ' + err.message;
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
